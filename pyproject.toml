[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shortener-url"
version = "0.1.0"
description = "URL shortener service built with FastAPI"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    {name = "Marcel Bittar", email = "marcel.bittar@gmail.com"}
]
license = {text = "MIT"}
keywords = ["url", "shortener", "fastapi"]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.6.0",
    "httpx>=0.25.0",
]

test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
]

[tool.setuptools]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"
indent-width = 4
exclude = [
    "__init__.py",
    ".git",
    "__pycache__",
    "venv",
    ".venv",
    "build",
    "dist",
    ".vscode",
]

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # whitespace and newlines
    "I",    # isort
    "UP",   # modernize
    "ANN",  # flake8 type annotations
    "S",    # flake8 bandit
    "B",    # flake8 bugbear
    "C4",   # flake8 comprehensions
    "COM",  # flake8 commas
    "T20",  # flake8 print
    "SIM",  # flake8 simplify
    "ARG",  # flake8 unused arguments
    "DTZ",  # flake8 datetimes
    "Q",    # flake8 quotes
    "TCH",  # flake8 typecheck
    "D",    # pydocstyle
    "RUF",  # ruff-specific rules
]
fixable = ["ALL"]
ignore = [
    "D203", "D213", "D215", "D400", "D401", "D404", "D406",
    "D407", "D408", "D409", "D413", "COM812", "ISC001",
    "E501",  # line too long, handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"test*" = ["D", "ANN"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 100

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --cov=app --cov-report=html --cov-report=term"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
